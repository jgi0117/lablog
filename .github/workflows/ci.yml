name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # 시간대에 따라 결과가 달라지는 코드를 잡으려고 시간대를 바꿔 가며 돌린다.
    strategy:
      matrix:
        tz: [UTC, Asia/Seoul, America/Los_Angeles]
    env:
      TZ: ${{ matrix.tz }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: 린트, 타입 검사, 테스트
        run: npm run check
      - name: 빌드
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: 브라우저 설치 (Chromium, Firefox, WebKit)
        run: npx playwright install --with-deps chromium firefox webkit
      - name: E2E (세 브라우저)
        run: npm run e2e
      - name: 실패 시 보고서 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            app/playwright-report
            app/test-results
          retention-days: 7
